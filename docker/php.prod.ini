; PHP de producción — API Hacienda
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 14M
expose_php = Off
display_errors = Off
log_errors = On

; Laravel no usa sesiones nativas de PHP: el progreso de subidas no
; sirve de nada y fue la vía de PHP2Shell (CVE-2026-109619).
session.upload_progress.enabled = Off

; OPcache: el código no cambia dentro del contenedor (deploy = imagen
; nueva), así que no se revalidan timestamps.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
