# Stack de desarrollo del API Hacienda (Laravel 12).
#
# El stack del API legacy (referencia/golden master) vive aparte en
# /legacy/docker-compose.yml y expone MariaDB en el puerto 4407, que es el
# default de la conexión "legacy" usada por `php artisan legacy:migrate-data`.
services:
  # Instala vendor/ ANTES de arrancar la app: un clon fresco levanta con
  # `docker compose up` sin pasos manuales. Idempotente (composer no hace
  # nada si vendor ya está al día). --ignore-platform-reqs porque las
  # extensiones viven en el contenedor de la app, no en el de composer.
  deps:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: install --no-interaction --prefer-dist --ignore-platform-reqs

  app:
    image: php:8.4.27-cli
    working_dir: /var/www/html
    command: >
      bash -c "docker-php-ext-install pdo_mysql mysqli gd > /dev/null 2>&1 || true;
               php artisan serve --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8888:8000"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: api_hacienda
      DB_USERNAME: hacienda
      DB_PASSWORD: hacienda
      LEGACY_DB_HOST: host.docker.internal
    depends_on:
      deps:
        condition: service_completed_successfully
      mysql:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mariadb:11
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      TZ: America/Costa_Rica
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: api_hacienda
      MYSQL_USER: hacienda
      MYSQL_PASSWORD: hacienda
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
